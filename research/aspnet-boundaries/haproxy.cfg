global
  log stdout format raw local0
  maxconn 256

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 10s
  timeout server 10s

frontend inbound
  bind 127.0.0.1:5092
  acl upstream_gated path_beg /gate/
  http-request deny deny_status 403 if upstream_gated
  default_backend aspnet

backend aspnet
  server local_app 127.0.0.1:5089
