global
  log stdout format raw local0
  maxconn 128

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 10s
  timeout server 10s

frontend fragile_policy
  bind 127.0.0.1:5102
  acl sensitive_path path_beg /gate/
  http-request deny deny_status 403 if sensitive_path
  default_backend local_aspnet

frontend hardened_policy
  bind 127.0.0.1:5104
  # Decode one level of URL escapes before applying the same path-prefix policy.
  acl sensitive_path path,url_dec -m beg /gate/
  http-request deny deny_status 403 if sensitive_path
  default_backend local_aspnet

frontend guarded_policy
  bind 127.0.0.1:5105
  # Explicitly refuse both literal and once-decoded dot-segment navigation.
  acl protected_decoded path,url_dec -m beg /gate/
  acl raw_parent_path path -m sub /../
  acl decoded_parent_path path,url_dec -m sub /../
  http-request deny deny_status 403 if protected_decoded
  http-request deny deny_status 403 if raw_parent_path
  http-request deny deny_status 403 if decoded_parent_path
  default_backend local_aspnet

backend local_aspnet
  server isolated 127.0.0.1:5100
