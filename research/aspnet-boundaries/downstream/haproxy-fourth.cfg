global
  expose-experimental-directives
  log stdout format raw local0
  maxconn 128

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 10s
  timeout server 10s

frontend fourth_raw
  bind 127.0.0.1:5112
  acl restricted_raw path_beg /gate/
  http-request deny deny_status 403 if restricted_raw
  default_backend local_app

frontend fourth_normalized
  bind 127.0.0.1:5114
  # Normalize unreserved encodings *before* removing dot segments.
  http-request normalize-uri percent-decode-unreserved strict
  http-request normalize-uri path-merge-slashes
  http-request normalize-uri path-strip-dot
  http-request normalize-uri path-strip-dotdot full
  acl restricted_normalized path_beg /gate/
  http-request deny deny_status 403 if restricted_normalized
  default_backend local_app

frontend fourth_normalized_and_decoded
  bind 127.0.0.1:5116
  http-request normalize-uri percent-decode-unreserved strict
  http-request normalize-uri path-merge-slashes
  http-request normalize-uri path-strip-dot
  http-request normalize-uri path-strip-dotdot full
  acl restricted_decoded path,url_dec -m beg /gate/
  http-request deny deny_status 403 if restricted_decoded
  default_backend local_app

backend local_app
  server fixture 127.0.0.1:5100
