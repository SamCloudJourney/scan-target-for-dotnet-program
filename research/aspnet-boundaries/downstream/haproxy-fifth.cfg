global
  expose-experimental-directives
  log stdout format raw local0
  maxconn 128

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 10s
  timeout server 10s

frontend previous_normalized_policy
  bind 127.0.0.1:5116
  http-request normalize-uri percent-decode-unreserved strict
  http-request normalize-uri path-merge-slashes
  http-request normalize-uri path-strip-dot
  http-request normalize-uri path-strip-dotdot full
  acl restricted_decoded path,url_dec -m beg /gate/
  http-request deny deny_status 403 if restricted_decoded
  default_backend local_app

frontend extra_ingress_guard
  bind 127.0.0.1:5118
  # Reject encoded path separators before normalization, then normalize URI
  # and apply decoded-prefix ACL. Only a bounded lab policy, not universal.
  acl encoded_slash path -m sub -i %2f
  acl encoded_backslash path -m sub -i %5c
  http-request deny deny_status 403 if encoded_slash
  http-request deny deny_status 403 if encoded_backslash
  http-request normalize-uri percent-decode-unreserved strict
  http-request normalize-uri path-merge-slashes
  http-request normalize-uri path-strip-dot
  http-request normalize-uri path-strip-dotdot full
  acl restricted_decoded path,url_dec -m beg /gate/
  http-request deny deny_status 403 if restricted_decoded
  default_backend local_app

backend local_app
  server fixture 127.0.0.1:5100
