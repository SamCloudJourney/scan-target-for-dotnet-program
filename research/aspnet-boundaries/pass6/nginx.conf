worker_processes 1;
pid /tmp/pass6-nginx.pid;
error_log /tmp/pass6-nginx-error.log notice;
events { worker_connections 256; }
http {
  access_log /tmp/pass6-nginx-access.log;
  client_body_temp_path /tmp/pass6-nginx-client;
  proxy_temp_path /tmp/pass6-nginx-proxy;
  server {
    listen 127.0.0.1:5204;
    server_name _;
    location / {
      if ($request_uri ~ "^/gate/") { return 403; }
      proxy_set_header Host 127.0.0.1;
      proxy_pass http://127.0.0.1:5200;
    }
  }
  server {
    listen 127.0.0.1:5205;
    server_name _;
    location / {
      if ($uri ~ "^/gate/") { return 403; }
      proxy_set_header Host 127.0.0.1;
      proxy_pass http://127.0.0.1:5200;
    }
  }
}
