global
  expose-experimental-directives
  log stdout format raw local0
  maxconn 256

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 10s
  timeout server 10s

frontend raw_security_only
  bind 127.0.0.1:5202
  acl restricted path_beg /gate/
  http-request deny deny_status 403 if restricted
  default_frontend normalized_case_insensitive
  bind 127.0.0.1:5208
  http-request normalize-uri percent-decode-unreserved strict
  http-request normalize-uri path-merge-slashes
  http-request normalize-uri path-strip-dot
  http-request normalize-uri path-strip-dotdot full
  # Case-insensitive path policy matches ASP.NET endpoint routing.
  acl restricted path,url_dec -m beg -i /gate/
  http-request deny deny_status 403 if restricted
  default_backend backend_security

backend backend_security

frontend normalized_security_only
  bind 127.0.0.1:5203
  http-request normalize-uri percent-decode-unreserved strict
  http-request normalize-uri path-merge-slashes
  http-request normalize-uri path-strip-dot
  http-request normalize-uri path-strip-dotdot full
  acl restricted path,url_dec -m beg /gate/
  http-request deny deny_status 403 if restricted
  default_backend backend_security

backend backend_security
  server loopback_backend 127.0.0.1:5200
