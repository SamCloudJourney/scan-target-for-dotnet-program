name: Disposable Windows SDK validator experiment
on:
  push:
    branches:
      - research/windows-elevation-boundary-20261116
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-sdk-11:
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/windows-elevation-boundary-20261116/isolated-windows-validator.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - name: Invoke shipped SDK path validators against disposable junctions
        shell: pwsh
        run: ./research/windows-elevation-boundary-20261116/isolated-windows-validator.ps1 -SdkVersion '11.0.100'
      - name: Preserve experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-windows-sdk11-evidence
          path: ${{ runner.temp }}/windows-elevation-11.0.100.json
          if-no-files-found: warn
          retention-days: 7
