name: Disposable Windows SDK validator experiment
on:
  push:
    branches: [research/windows-elevation-msrc-gates-20261116]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-boundary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-path-validation:
    runs-on: windows-2022
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        sdk: ['11.0.100', '10.0.404']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/windows-elevation-boundary-20261116/ValidatorHarness/Program.cs
            research/windows-elevation-boundary-20261116/ValidatorHarness/ValidatorHarness.csproj
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100
            10.0.404
      - name: Invoke actual SDK path validators with disposable fixtures
        shell: pwsh
        run: dotnet run --project ./research/windows-elevation-boundary-20261116/ValidatorHarness/ValidatorHarness.csproj --configuration Release -- ${{ matrix.sdk }}
      - name: Preserve experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-windows-${{ matrix.sdk }}-evidence
          path: ${{ runner.temp }}/windows-elevation-${{ matrix.sdk }}.json
          if-no-files-found: warn
          retention-days: 7
  live-broker-isolated:
    runs-on: windows-2022
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        sdk: ['11.0.100', '10.0.404']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/windows-elevation-boundary-20261116/BrokerHarness/Program.cs
            research/windows-elevation-boundary-20261116/BrokerHarness/BrokerHarness.csproj
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100
            10.0.404
      - name: Build self-authored isolated broker harness
        shell: pwsh
        run: dotnet build ./research/windows-elevation-boundary-20261116/BrokerHarness/BrokerHarness.csproj --configuration Release
      - name: Test actual workload broker with disposable paths and nonexistent MSI
        shell: pwsh
        run: dotnet ./research/windows-elevation-boundary-20261116/BrokerHarness/bin/Release/net11.0/BrokerHarness.dll ${{ matrix.sdk }}
      - name: Preserve actual broker session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-windows-${{ matrix.sdk }}-evidence
          path: ${{ runner.temp }}/broker-process-${{ matrix.sdk }}.json
          if-no-files-found: warn
          retention-days: 7
  standard-user-no-uac:
    runs-on: windows-2022
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        sdk: ['11.0.100', '10.0.404']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/windows-elevation-boundary-20261116/standard-user-denial.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100
            10.0.404
      - name: Standard-user direct broker start must fail without UAC
        shell: pwsh
        run: ./research/windows-elevation-boundary-20261116/standard-user-denial.ps1 -SdkVersion '${{ matrix.sdk }}'
      - name: Preserve negative control result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-user-${{ matrix.sdk }}-negative-control
          path: ${{ runner.temp }}/standard-user-no-uac-${{ matrix.sdk }}.json
          if-no-files-found: warn
          retention-days: 7

  downstream-cache-fixtures:
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        sdk: ['11.0.100', '10.0.404']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/windows-elevation-boundary-20261116/CacheHarness/CacheHarness.csproj
            research/windows-elevation-boundary-20261116/CacheHarness/Program.cs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100
            10.0.404
      - name: Exercise shipped SDK CachePayload in disposable isolated cache
        shell: pwsh
        run: dotnet run --project ./research/windows-elevation-boundary-20261116/CacheHarness/CacheHarness.csproj -c Release -- ${{ matrix.sdk }}
      - name: Preserve downstream cache experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-downstream-${{ matrix.sdk }}-evidence
          path: ${{ runner.temp }}/cache-downstream-${{ matrix.sdk }}.json
          if-no-files-found: warn
          retention-days: 7


  cross-account-acl-differential:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: ['11.0.100', '10.0.404']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/windows-elevation-boundary-20261116/cross-account-low-probe.ps1
            research/windows-elevation-boundary-20261116/cross-account-differential.ps1
            research/windows-elevation-boundary-20261116/cross-account-cache-postread.ps1
            research/windows-elevation-boundary-20261116/SecurityAclHarness/SecurityAclHarness.csproj
            research/windows-elevation-boundary-20261116/SecurityAclHarness/Program.cs
            research/windows-elevation-boundary-20261116/BrokerHarness/Program.cs
            research/windows-elevation-boundary-20261116/BrokerHarness/BrokerHarness.csproj
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100
            10.0.404
      - name: Verify separate standard-user ACLs and real admin broker effects
        shell: pwsh
        run: ./research/windows-elevation-boundary-20261116/cross-account-differential.ps1 -SdkVersion '${{ matrix.sdk }}'
      - name: Preserve cross-account and broker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-account-${{ matrix.sdk }}-evidence
          path: |
            ${{ runner.temp }}/cross-account-${{ matrix.sdk }}.json
            ${{ runner.temp }}/pipe-acl-${{ matrix.sdk }}.json
            ${{ runner.temp }}/broker-process-${{ matrix.sdk }}.json
          if-no-files-found: warn
          retention-days: 7

  sibling-peer:
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        sdk: ['10.0.404', '11.0.100']
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/windows-elevation-boundary-20261116/SiblingPipeHarness/Program.cs
            research/windows-elevation-boundary-20261116/SiblingPipeHarness/SiblingPipeHarness.csproj
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100
            10.0.404
      - name: Build same-SID peer harness
        shell: pwsh
        run: dotnet build ./research/windows-elevation-boundary-20261116/SiblingPipeHarness/SiblingPipeHarness.csproj -c Release --nologo
      - name: Run real broker with separate same-SID peer in disposable workspace
        shell: pwsh
        run: dotnet ./research/windows-elevation-boundary-20261116/SiblingPipeHarness/bin/Release/net11.0/SiblingPipeHarness.dll ${{ matrix.sdk }}
      - name: Preserve broker, peer and environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sibling-peer-${{ matrix.sdk }}-evidence
          path: |
            ${{ runner.temp }}/sibling-pipe-${{ matrix.sdk }}.json
            ${{ runner.temp }}/sibling-peer-${{ matrix.sdk }}.json
          if-no-files-found: warn
          retention-days: 7
