name: Bounded ILLink-style symbol reader reachability
on:
  push:
    branches: [research/bounded-resource-probes-20261116]
    paths:
      - 'research/bounded-resource-probes/LinkerLike/**'
      - '.github/workflows/resource-linker-like.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  isolated-reader-choice:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research/bounded-resource-probes
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Build investigator-only minimal harness
        shell: bash
        run: |
          set -euo pipefail
          dotnet build research/bounded-resource-probes/Sample/Sample.csproj -c Release
          dotnet build research/bounded-resource-probes/LinkerLike/LinkerLike.csproj -c Release -f net10.0
          dotnet build research/bounded-resource-probes/LinkerLike/LinkerLike.csproj -c Release -f net11.0
      - name: Compare direct, disabled and ILLink-like symbol-reader calls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linker-like-evidence
          for fx in net10.0 net11.0; do
            if [ "$fx" = net10.0 ]; then tag=10.0.15; else tag=11.0.0; fi
            image="mcr.microsoft.com/dotnet/runtime:$tag"
            docker pull "$image"
            app="$PWD/research/bounded-resource-probes/LinkerLike/bin/Release/$fx"
            src="$PWD/research/bounded-resource-probes/Sample/bin/Release/net10.0"
            run_probe() {
              timeout --signal=TERM --kill-after=2s 12s docker run --rm \
                --memory=384m --memory-swap=384m --cpus=1 --pids-limit=48 \
                --network none --read-only --tmpfs /tmp:rw,nosuid,size=24m \
                -e DOTNET_GCHeapHardLimit=0x10000000 \
                -v "$app:/app:ro" -v "$src:/sample:ro" \
                "$image" dotnet /app/LinkerLike.dll /sample/Sample.dll "$@" \
                | tee -a linker-like-evidence/results.jsonl
            }
            for declared in 256 1048576 8388608 -1; do
              for mode in disabled linker direct builtin; do
                run_probe "$declared" "$mode"
              done
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linker-like-reader-choice
          path: linker-like-evidence/
          retention-days: 14
