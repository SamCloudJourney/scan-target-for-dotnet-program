name: F073 credential loss owned lab 20261120
on:
  push:
    branches:
      - f073-credential-loss-20261120
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install released Aspire and Playwright CLIs
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install Aspire.Cli --version 17.0.0 --tool-path "$RUNNER_TEMP/f073-tools"
          npm install -g --prefix "$RUNNER_TEMP/f073-npm" @playwright/cli
          "$RUNNER_TEMP/f073-tools/aspire" --version
          "$RUNNER_TEMP/f073-npm/bin/playwright-cli" --version
      - name: Commit-only symlink credential matrix
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/f073-tools:$RUNNER_TEMP/f073-npm/bin:$PATH"
          base="/tmp/f073-credential-loss-$GITHUB_RUN_ID"
          mkdir -p "$base"
          chmod 755 "$base"
          sudo useradd -m f073low
          printf 'owned inert signing challenge\n' > "$base/challenge"
          make_case() {
            kind="$1"
            mode="$2"
            case_dir="$base/$kind"
            repo="$case_dir/repo"
            protected="$case_dir/higher_home"
            key="$protected/.ssh/id_ed25519"
            mkdir -p "$repo/.agents/skills" "$protected/.ssh"
            chmod 755 "$case_dir" "$repo" "$repo/.agents" "$repo/.agents/skills"
            chmod 700 "$protected" "$protected/.ssh"
            ssh-keygen -q -t ed25519 -N '' -f "$key"
            printf 'Host synthetic.invalid\n  User synthetic\n' > "$protected/.ssh/config"
            chmod 600 "$protected/.ssh/config"
            git -C "$repo" init -q
            sudo chown -R f073low:f073low "$repo"
            if [ "$mode" = link ]; then
              sudo -u f073low ln -s "$protected/.ssh" "$repo/.agents/skills/playwright-cli"
            else
              sudo -u f073low mkdir "$repo/.agents/skills/playwright-cli"
              printf 'in-repository only\n' | sudo -u f073low tee "$repo/.agents/skills/playwright-cli/keep.txt" >/dev/null
            fi
            sudo -u f073low git -C "$repo" add .agents/skills/playwright-cli
            sudo -u f073low git -C "$repo" -c user.name=f073low -c user.email=f073low@example.invalid commit -qm 'Commit only agent skill path'
            git clone -q "$repo" "$case_dir/checkout"
            checkout="$case_dir/checkout"
            echo "CASE=$kind MODE=$mode"
            git -C "$checkout" ls-tree -r HEAD
            if [ "$mode" = link ]; then
              test -L "$checkout/.agents/skills/playwright-cli"
              echo "LINK_TARGET=$(readlink "$checkout/.agents/skills/playwright-cli")"
            else
              test -d "$checkout/.agents/skills/playwright-cli"
              test ! -L "$checkout/.agents/skills/playwright-cli"
            fi
            echo "PROTECTED_PERMS=$(stat -c '%U:%G %a' "$protected/.ssh")"
            if sudo -u f073low test -r "$key"; then echo LOW_DIRECT_READ=ALLOWED; exit 1; else echo LOW_DIRECT_READ=DENIED; fi
            if sudo -u f073low test -w "$key"; then echo LOW_DIRECT_WRITE=ALLOWED; exit 1; else echo LOW_DIRECT_WRITE=DENIED; fi
            ssh-keygen -Y sign -n f073 -f "$key" < "$base/challenge" >/dev/null
            echo PRE_SIGN=SUCCESS
          }
          intact() {
            protected="$1"
            test -s "$protected/.ssh/id_ed25519"
            test -s "$protected/.ssh/config"
            ssh-keygen -Y sign -n f073 -f "$protected/.ssh/id_ed25519" < "$base/challenge" >/dev/null
            echo "POST_SIGN=SUCCESS"
          }
          lost() {
            protected="$1"
            test ! -e "$protected/.ssh/id_ed25519"
            test ! -e "$protected/.ssh/config"
            test -s "$protected/.ssh/SKILL.md"
            if ssh-keygen -Y sign -n f073 -f "$protected/.ssh/id_ed25519" < "$base/challenge" >/dev/null 2>&1; then
              echo POST_SIGN=UNEXPECTED_SUCCESS
              exit 1
            fi
            echo POST_SIGN=FAILED_PRIVATE_KEY_DELETED
            echo "SYNTHETIC_SSH_SKILL_SHA256=$(sha256sum "$protected/.ssh/SKILL.md" | cut -d ' ' -f 1)"
          }
          make_case raw link
          ( cd "$base/raw/checkout" && playwright-cli install --skills )
          intact "$base/raw/higher_home"
          echo RAW_PLAYWRIGHT_CONTROL=INTACT
          make_case no_skill link
          aspire agent init --workspace-root "$base/no_skill/checkout" --agents copilot --scope project --skills none --non-interactive --nologo
          intact "$base/no_skill/higher_home"
          echo NO_SKILL_CONTROL=INTACT
          make_case path_control regular
          aspire agent init --workspace-root "$base/path_control/checkout" --agents copilot --scope project --skills playwright-cli --non-interactive --nologo
          intact "$base/path_control/higher_home"
          echo REGULAR_PATH_CONTROL=INTACT
          for kind in positive1 positive2; do
            make_case "$kind" link
            aspire agent init --workspace-root "$base/$kind/checkout" --agents copilot --scope project --skills playwright-cli --non-interactive --nologo
            lost "$base/$kind/higher_home"
            echo "ASPIRE_$kind=SSH_CREDENTIAL_LOSS"
          done
          make_case maintained_args link
          (
            cd "$base/maintained_args/checkout"
            aspire agent init --skills all --skill-locations all --non-interactive --nologo || true
          )
          if test ! -e "$base/maintained_args/higher_home/.ssh/id_ed25519"; then
            lost "$base/maintained_args/higher_home"
            echo MAINTAINED_ARGS=SSH_CREDENTIAL_LOSS
          else
            intact "$base/maintained_args/higher_home"
            echo MAINTAINED_ARGS=INTACT
          fi
