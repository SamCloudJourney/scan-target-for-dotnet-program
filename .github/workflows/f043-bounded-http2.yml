name: F-043 bounded HTTP2 padding lab
on:
  push:
    branches:
      - research/f043-http2-padding-20261120
    paths:
      - .github/workflows/f043-bounded-http2.yml
  workflow_dispatch:
jobs:
  owned-windows-lab:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            f043-lab
          sparse-checkout-cone-mode: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Record runtime inventory
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet --list-runtimes
          python --version
      - name: Build released runtime host targets
        shell: pwsh
        run: |
          dotnet build f043-lab/f043-lab.csproj -f net10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build f043-lab/f043-lab.csproj -f net11.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run bounded two-client matrix
        shell: pwsh
        run: |
          python f043-lab/probe3.py | Tee-Object -FilePath f043-one-byte-results.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f043-one-byte-results
          path: f043-one-byte-results.jsonl
          if-no-files-found: ignore
