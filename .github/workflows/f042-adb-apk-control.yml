name: F042 Android APK equivalent-access control

on:
  push:
    branches:
      - research/f042-maui-aspire-20261120
    paths:
      - .github/workflows/f042-adb-apk-control.yml
      - .github/scripts/f042-adb-apk-control.sh

jobs:
  apk-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install released SDK and current Android workload
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Install Android workload
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install android
          dotnet workload list
      - name: Fetch owned APK control
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/scripts/f042-adb-apk-control.sh" \
            -o /tmp/f042-adb-apk-control.sh
          bash -n /tmp/f042-adb-apk-control.sh
      - name: Boot emulator and test peer APK extraction
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          script: bash /tmp/f042-adb-apk-control.sh
