name: F064 Aspire 17 parent target control
on:
  push:
    branches:
      - f064-aspire17-parent-target-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/f064-aspire17-parent-target-20261120
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100
      - name: Test released Aspire CLI and SDK TemplateEngine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DOTNET_CLI_HOME = Join-Path $env:RUNNER_TEMP 'f064-aspire17-cli-home'
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          $root = Join-Path $env:RUNNER_TEMP 'f064-aspire17-parent-target-20261120'
          $workspace = Join-Path $root 'workspace'
          $trusted = Join-Path $workspace 'trusted'
          $target = Join-Path $workspace 'Directory.Build.targets'
          $marker = Join-Path $root 'trusted-build-marker.txt'
          $toolDir = Join-Path $root 'tools'
          New-Item -ItemType Directory -Force $trusted, $toolDir | Out-Null
          Set-Content -LiteralPath (Join-Path $trusted 'Trusted.csproj') -Value '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net11.0</TargetFramework></PropertyGroup></Project>' -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $trusted 'Class1.cs') -Value 'public class Trusted { public static int Value => 1; }' -Encoding UTF8
          dotnet --version
          dotnet tool install Aspire.Cli --version 17.0.0 --tool-path $toolDir
          if ($LASTEXITCODE -ne 0) { throw 'Aspire CLI install failed' }
          Get-ChildItem -LiteralPath $toolDir | ForEach-Object { Write-Host "TOOL|$($_.Name)" }
          $aspire = (Get-ChildItem -LiteralPath $toolDir -File | Where-Object { $_.Name -like 'aspire*' } | Select-Object -First 1).FullName
          if (!$aspire) { throw 'Aspire tool entrypoint not found' }
          & $aspire --version
          if ($LASTEXITCODE -ne 0) { throw 'Aspire version failed' }
          $base = 'research/f064-aspire17-parent-target-20261120'
          function Invoke-Source([string]$variant, [string]$output) {
            $sourcePath = Join-Path $env:GITHUB_WORKSPACE "$base/$variant"
            & $aspire --non-interactive --nologo new --template-path $sourcePath --name F064Synthetic --output $output --suppress-agent-init 2>&1 | Out-Host
            return $LASTEXITCODE
          }
          function Invoke-TrustedBuild([string]$label, [bool]$expectedMarker) {
            if (Test-Path -LiteralPath $marker) { Remove-Item -LiteralPath $marker -Force }
            & dotnet build (Join-Path $trusted 'Trusted.csproj') -t:Rebuild -p:F064MarkerPath=$marker --nologo -v:q 2>&1 | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Trusted build failed: $label" }
            $exists = Test-Path -LiteralPath $marker
            if ($exists -ne $expectedMarker) { throw "Unexpected marker state: $label=$exists" }
            if ($exists -and (Get-Content -Raw -LiteralPath $marker).Trim() -ne 'F064_TRUSTED_BUILD_CONSUMED') { throw 'Marker content mismatch' }
            Write-Host "RESULT|$label|trusted-build=0|marker=$exists"
          }
          Invoke-TrustedBuild 'baseline' $false
          $safeOut = Join-Path $workspace 'safe'
          $safeRc = Invoke-Source 'safe' $safeOut
          if ($safeRc -ne 0 -or !(Test-Path -LiteralPath (Join-Path $safeOut 'Directory.Build.targets')) -or (Test-Path -LiteralPath $target)) { throw 'Safe source result mismatch' }
          Write-Host "RESULT|safe-template|rc=$safeRc|inside=True|parent=False"
          Invoke-TrustedBuild 'safe-control' $false
          $insideOut = Join-Path $workspace 'inside-existing'
          New-Item -ItemType Directory -Force $insideOut | Out-Null
          $insidePath = Join-Path $insideOut 'Directory.Build.targets'
          Set-Content -LiteralPath $insidePath -Value '<Project><!-- F064_INSIDE_GUARD --></Project>' -Encoding UTF8
          $insideHash = (Get-FileHash -LiteralPath $insidePath -Algorithm SHA256).Hash
          $insideRc = Invoke-Source 'safe' $insideOut
          $insideUnchanged = ((Get-FileHash -LiteralPath $insidePath -Algorithm SHA256).Hash -eq $insideHash)
          if ($insideRc -eq 0 -or !$insideUnchanged) { throw 'Aspire selected-output guard failed' }
          Write-Host "RESULT|aspire-inside-existing|rc=$insideRc|unchanged=$insideUnchanged"
          $sdkRoot = Join-Path $root 'sdk-control'
          New-Item -ItemType Directory -Force $sdkRoot | Out-Null
          $sdkTarget = Join-Path $sdkRoot 'Directory.Build.targets'
          Set-Content -LiteralPath $sdkTarget -Value '<Project><!-- F064_SDK_GUARD --></Project>' -Encoding UTF8
          $sdkHash = (Get-FileHash -LiteralPath $sdkTarget -Algorithm SHA256).Hash
          $sourceEscape = Join-Path $env:GITHUB_WORKSPACE "$base/escape"
          & dotnet new install $sourceEscape 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'SDK template install failed' }
          & dotnet new f064-aspire-parent --output (Join-Path $sdkRoot 'blocked') 2>&1 | Out-Host
          $sdkRc = $LASTEXITCODE
          $sdkUnchanged = ((Get-FileHash -LiteralPath $sdkTarget -Algorithm SHA256).Hash -eq $sdkHash)
          if ($sdkRc -eq 0 -or !$sdkUnchanged) { throw 'SDK existing-parent guard failed' }
          Write-Host "RESULT|sdk-existing-parent|rc=$sdkRc|unchanged=$sdkUnchanged"
          Set-Content -LiteralPath $target -Value '<Project><!-- F064_ASPIRE_GUARD --></Project>' -Encoding UTF8
          $guardHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          $parentRc = Invoke-Source 'escape' (Join-Path $workspace 'parent-existing')
          $afterHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          $safeHash = (Get-FileHash -LiteralPath (Join-Path $safeOut 'Directory.Build.targets') -Algorithm SHA256).Hash
          $markerBefore = Test-Path -LiteralPath $marker
          if ($parentRc -ne 0 -or $afterHash -eq $guardHash -or $afterHash -ne $safeHash -or $markerBefore) { throw 'Aspire parent existing-file result mismatch' }
          Write-Host "RESULT|aspire-existing-parent|rc=$parentRc|overwritten=True|same-payload=True|marker-before=$markerBefore"
          Invoke-TrustedBuild 'existing-parent-import' $true
          Remove-Item -LiteralPath $target -Force
          Invoke-TrustedBuild 'removed-control' $false
          $escapeRc = Invoke-Source 'escape' (Join-Path $workspace 'escape-one')
          if ($escapeRc -ne 0 -or !(Test-Path -LiteralPath $target)) { throw 'Parent target escape failed' }
          $escapeHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          if ($safeHash -ne $escapeHash -or (Test-Path -LiteralPath $marker)) { throw 'Fresh parent target result mismatch' }
          Write-Host "RESULT|aspire-new-parent|rc=$escapeRc|same-payload=True|path=$([IO.Path]::GetFullPath($target))"
          Invoke-TrustedBuild 'new-parent-import' $true
          Remove-Item -LiteralPath $target -Force
          Invoke-TrustedBuild 'second-removed-control' $false
          $repeatRc = Invoke-Source 'escape' (Join-Path $workspace 'escape-two')
          if ($repeatRc -ne 0 -or !(Test-Path -LiteralPath $target)) { throw 'Repeat parent escape failed' }
          Invoke-TrustedBuild 'repeat-parent-import' $true
          Write-Host "RESULT|repeat|rc=$repeatRc|same-payload=True"
          exit 0
