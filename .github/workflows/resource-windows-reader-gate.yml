name: Windows DiaSymReader reader boundary (small baseline only)
on:
  push:
    branches:
      - research/bounded-resource-probes-20261116
    paths:
      - 'research/bounded-resource-probes/WindowsGate/**'
      - '.github/workflows/resource-windows-reader-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-gate:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research/bounded-resource-probes
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Build only investigator-controlled test and PDB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build research/bounded-resource-probes/WindowsGate/WindowsGate.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Gate build failed" }
          dotnet build research/bounded-resource-probes/Portable/Portable.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Portable reader build failed" }
          dotnet build research/bounded-resource-probes/SourceSample/SourceSample.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Sample build failed" }
      - name: Check native-vs-managed Portable PDB reader format boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path windows-evidence | Out-Null
          $pdb = (Resolve-Path 'research/bounded-resource-probes/SourceSample/bin/Release/net10.0/SourceSample.pdb').Path
          $gate = (Resolve-Path 'research/bounded-resource-probes/WindowsGate/bin/Release/net10.0/WindowsGate.dll').Path
          $managed = (Resolve-Path 'research/bounded-resource-probes/Portable/bin/Release/net10.0/Portable.dll').Path
          function Run-Bounded([string[]]$ProgramArgs) {
            $tempOut = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString() + '.out')
            $tempErr = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString() + '.err')
            $p = Start-Process -FilePath 'dotnet' -ArgumentList $ProgramArgs -Wait:$false -PassThru -RedirectStandardOutput $tempOut -RedirectStandardError $tempErr -NoNewWindow
            try {
              if (-not $p.WaitForExit(15000)) {
                $p.Kill($true)
                throw "Bounded Windows process exceeded 15 seconds"
              }
              $output = Get-Content $tempOut -Raw
              $output | Tee-Object -FilePath windows-evidence/windows-reader.jsonl -Append
              if ($p.ExitCode -ne 0) {
                throw "Program exited $($p.ExitCode): $(Get-Content $tempErr -Raw)"
              }
            }
            finally {
              Remove-Item $tempOut,$tempErr -Force -ErrorAction SilentlyContinue
            }
          }
          # Native factory uses only a VALID small baseline PDB (never mutated).
          Run-Bounded @($gate, $pdb, "0")
          Run-Bounded @($gate, $pdb, "1048576")
          Run-Bounded @($gate, $pdb, "8388608")
          # Managed bridge positive control, small and 8 MiB bounded forged size.
          Run-Bounded @($managed, $pdb, "0")
          Run-Bounded @($managed, $pdb, "8388608")
          Run-Bounded @($managed, $pdb, "8388608", "guarded")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-reader-boundary-evidence
          path: windows-evidence/
          if-no-files-found: warn
          retention-days: 14
