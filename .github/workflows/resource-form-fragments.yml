name: Deterministic FormPipeReader patched-vs-historical fragments
on:
  push:
    branches: [research/bounded-resource-probes-20261116]
    paths:
      - 'research/bounded-resource-probes/FormFragment/**'
      - '.github/workflows/resource-form-fragments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-pipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: research/bounded-resource-probes
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Build form parser harness
        shell: bash
        run: |
          set -euo pipefail
          dotnet build research/bounded-resource-probes/FormFragment/FormFragment.csproj -c Release -f net10.0
          dotnet build research/bounded-resource-probes/FormFragment/FormFragment.csproj -c Release -f net11.0
      - name: Parse bounded segmented real PipeReader inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p form-evidence
          for spec in '10.0.12 net10.0' '10.0.15 net10.0' '11.0.0 net11.0'; do
            read -r tag fx <<< "$spec"
            image="mcr.microsoft.com/dotnet/aspnet:$tag"
            docker pull "$image"
            dir="$PWD/research/bounded-resource-probes/FormFragment/bin/Release/$fx"
            echo "{\"start\":\"$tag\",\"fx\":\"$fx\"}" | tee -a form-evidence/form-pipe.jsonl
            timeout --kill-after=3s 115s docker run --rm \
              --memory=384m --memory-swap=384m --cpus=1 --pids-limit=48 \
              --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=8m \
              -e DOTNET_GCHeapHardLimit=0xC000000 \
              -v "$dir:/app:ro" "$image" \
              dotnet /app/FormFragment.dll | tee -a form-evidence/form-pipe.jsonl
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-form-pipereader-fragmentation
          path: form-evidence/
          retention-days: 14
