name: Bounded .NET ILLink production-consumer check
on:
  push:
    branches:
      - research/bounded-resource-probes-20261116
    paths:
      - 'research/bounded-resource-probes/Linker/**'
      - '.github/workflows/resource-illink-consumer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linker-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research/bounded-resource-probes
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Prepare only owned assembly and restore linker tasks
        shell: bash
        run: |
          set -euo pipefail
          dotnet build research/bounded-resource-probes/Sample/Sample.csproj -c Release
          dotnet build research/bounded-resource-probes/Linker/Mutate/Mutate.csproj -c Release
          mkdir -p research/bounded-resource-probes/Linker
          dotnet research/bounded-resource-probes/Linker/Mutate/bin/Release/net10.0/Mutate.dll \
            research/bounded-resource-probes/Sample/bin/Release/net10.0/Sample.dll \
            research/bounded-resource-probes/Linker
          dotnet restore research/bounded-resource-probes/Linker/Host/Host.csproj \
            -p:PublishTrimmed=true
      - name: Run actual dotnet publish trimming with strict offline container limits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p illink-evidence
          for fx in net10.0 net11.0; do
            if [ "$fx" = net10.0 ]; then sdk=10.0.404; else sdk=11.0.100; fi
            image="mcr.microsoft.com/dotnet/sdk:$sdk"
            docker pull "$image"
            for mode in InputBaseline InputSmall InputAltered InputAltered InputSmall InputBaseline; do
              echo "START $fx $mode" | tee -a illink-evidence/publish.log
              work="$PWD/research/bounded-resource-probes/Linker"
              # No external network; 768 MiB memory, 2 CPUs, 128 PIDs; <=120s.
              # Only input difference is the 4-byte declared embedded PDB length.
              timeout --signal=TERM --kill-after=3s 120s docker run --rm \
                --memory=768m --memory-swap=768m --cpus=2 --pids-limit=128 \
                --network none --tmpfs /tmp:rw,nosuid,size=48m \
                -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_NOLOGO=1 \
                -e DOTNET_CLI_HOME=/tmp/dotnet -e NUGET_PACKAGES=/home/runner/.nuget/packages \
                -e MSBUILDDISABLENODEREUSE=1 -e DOTNET_GCHeapHardLimit=0x20000000 \
                -e FX="$fx" -e INPUT_MODE="$mode" \
                -v "$work:/work:rw" \
                -v "$HOME/.nuget/packages:/home/runner/.nuget/packages:ro" \
                "$image" bash -c '
                  cd /work
                  rm -rf Host/bin Host/obj/Release "/work/out-$FX-$INPUT_MODE"
                  start=$(date +%s%3N)
                  dotnet publish Host/Host.csproj -f "$FX" -c Release \
                    --no-restore -p:PublishTrimmed=true \
                    -p:SampleInputPath="/work/$INPUT_MODE/Sample.dll" \
                    -p:UseSharedCompilation=false -m:1 \
                    -o "/work/out-$FX-$INPUT_MODE" -v:normal \
                    > /tmp/publish-output.log 2>&1
                  exit_code=$?
                  end=$(date +%s%3N)
                  peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo -1)
                  if grep -q "ILLink" /tmp/publish-output.log; then linker_mentioned=true; else linker_mentioned=false; fi
                  printf "{\"framework\":\"%s\",\"input\":\"%s\",\"exit_code\":%d,\"elapsed_ms\":%d,\"container_memory_peak_bytes\":%s,\"ilink_in_log\":%s}\n" \
                    "$FX" "$INPUT_MODE" "$exit_code" "$((end-start))" "$peak" "$linker_mentioned"
                  if [ "$exit_code" != "0" ]; then
                    tail -n 40 /tmp/publish-output.log
                    for failure in /tmp/MSBuild_*.failure.txt; do
                      [ -f "$failure" ] && { echo "TASKHOST FAILURE"; tail -n 30 "$failure"; }
                    done
                  fi
                  exit 0
                ' | tee -a illink-evidence/publish.log
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-illink-production-consumer
          path: illink-evidence/
          if-no-files-found: warn
          retention-days: 14
