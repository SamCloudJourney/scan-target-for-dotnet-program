name: ASP.NET third-pass consequence and normalization matrix
on:
  push:
    branches: [research/aspnet-boundary-five-20261116]
    paths:
      - '.github/workflows/aspnet-third-pass.yml'
      - 'research/aspnet-boundaries/downstream/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thirdpass:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '10.0.404'
            major: 10
          - sdk: '11.0.100'
            major: 11
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/aspnet-boundaries/downstream
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}
      - name: Build and install isolated prerequisites
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y haproxy
          mkdir -p third-pass-evidence
          dotnet --info >third-pass-evidence/dotnet-info.txt
          haproxy -vv >third-pass-evidence/haproxy-version.txt
          haproxy -c -f research/aspnet-boundaries/downstream/haproxy-impact.cfg
          dotnet build research/aspnet-boundaries/downstream/ImpactFixture.csproj -p:TargetMajor=${{ matrix.major }} -o /tmp/third-pass-app
      - name: Loopback test - query formats, redirects, cookie jar, and proxy paths
        run: |
          dotnet /tmp/third-pass-app/ImpactFixture.dll >third-pass-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5100/healthz >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:5100/healthz >/dev/null
          haproxy -db -f research/aspnet-boundaries/downstream/haproxy-impact.cfg >third-pass-evidence/haproxy.log 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" "$server_pid" 2>/dev/null || true' EXIT
          for port in 5102 5104 5105; do
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:$port/healthz >/dev/null 2>&1; then break; fi
              sleep 0.5
            done
            curl -fsS http://127.0.0.1:$port/healthz >/dev/null
          done
          python3 research/aspnet-boundaries/downstream/third_pass.py --major ${{ matrix.major }} --output third-pass-evidence/third-pass-${{ matrix.major }}.json
      - name: Upload raw observations even on failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspnet-third-pass-net${{ matrix.major }}
          path: third-pass-evidence/
          retention-days: 30
