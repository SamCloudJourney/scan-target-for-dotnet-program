name: F057 Roslyn cache controlled Windows test
on:
  push:
    branches:
      - research/f057-roslyn-cache-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-key-cache:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Build and replay shipped compiler cache with controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          $root = Join-Path $env:RUNNER_TEMP 'f057-roslyn-cache'
          $victim = Join-Path $root 'victim'
          $poison = Join-Path $root 'poison'
          $cacheRoot = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'roslyn-cache'
          $victimCache = Join-Path $cacheRoot 'Victim.dll'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          function Invoke-Dotnet([string[]]$Command) {
            & dotnet @Command
            if ($LASTEXITCODE -ne 0) { throw "dotnet failed ($LASTEXITCODE): $($Command -join ' ')" }
          }
          function Build-Victim {
            Invoke-Dotnet @('clean', $victim, '-c', 'Release', '-v:q')
            Invoke-Dotnet @('build', $victim, '-c', 'Release', '-p:Features=use-global-cache', '-p:UseSharedCompilation=true', '-v:n')
          }
          function Run-Victim {
            $dll = Join-Path $victim 'bin\Release\net11.0\Victim.dll'
            $value = (& dotnet $dll | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Victim exit $LASTEXITCODE" }
            return $value
          }
          Write-Host "SDK=$(dotnet --version)"
          Write-Host "IDENTITY=$(whoami)"
          Write-Host "GROUPS=$(whoami /groups | Out-String)"
          Write-Host "CACHE_ROOT=$cacheRoot"
          if (Test-Path $victimCache) { Remove-Item -LiteralPath $victimCache -Recurse -Force }
          Invoke-Dotnet @('new', 'console', '--framework', 'net11.0', '--no-restore', '-n', 'Victim', '-o', $victim)
          Invoke-Dotnet @('new', 'console', '--framework', 'net11.0', '--no-restore', '-n', 'Victim', '-o', $poison)
          Set-Content -LiteralPath (Join-Path $victim 'Program.cs') -Value 'Console.WriteLine("BASELINE");'
          Set-Content -LiteralPath (Join-Path $poison 'Program.cs') -Value 'Console.WriteLine("POISON");'
          Build-Victim
          $cold = Run-Victim
          Write-Host "COLD_OUTPUT=$cold"
          if ($cold -ne 'BASELINE') { throw 'Cold baseline failed' }
          $entries = @(Get-ChildItem -LiteralPath $victimCache -Recurse -File -Filter assembly -ErrorAction SilentlyContinue)
          Write-Host "CACHE_ENTRY_COUNT=$($entries.Count)"
          if ($entries.Count -ne 1) { throw 'Expected one shipped compiler cache entry' }
          $entry = $entries[0].FullName
          $key = $entries[0].Directory.Name
          Write-Host "EXACT_KEY=$key"
          Invoke-Dotnet @('build', $poison, '-c', 'Release', '-v:q')
          $poisonDll = Join-Path $poison 'bin\Release\net11.0\Victim.dll'
          $canary = Join-Path $root 'protected-canary.txt'
          Set-Content -LiteralPath $canary -Value 'HIGH_CANARY'
          & icacls.exe $canary /setintegritylevel H
          Write-Host "CANARY_ACL=$(icacls.exe $canary | Out-String)"
          $lowScript = Join-Path $root 'medium.ps1'
          $lowResult = Join-Path $root 'medium-result.json'
          @'
          param([string]$CacheAssembly, [string]$PoisonDll, [string]$Canary, [string]$Result)
          $groupText = (whoami /groups | Out-String)
          $data = [ordered]@{
            identity = (whoami)
            mediumIntegrity = $groupText.Contains('S-1-16-8192')
            highIntegrity = $groupText.Contains('S-1-16-12288')
            cacheWrite = $false
            canaryWrite = $false
            cacheError = ''
            canaryError = ''
          }
          try { Copy-Item -LiteralPath $PoisonDll -Destination $CacheAssembly -Force; $data.cacheWrite = $true }
          catch { $data.cacheError = $_.Exception.Message }
          try { Set-Content -LiteralPath $Canary -Value 'LOW_WRITE'; $data.canaryWrite = $true }
          catch { $data.canaryError = $_.Exception.Message }
          $data | ConvertTo-Json -Compress | Set-Content -LiteralPath $Result
          '@ | Set-Content -LiteralPath $lowScript
          Add-Type -TypeDefinition @'
          using System;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          public static class MediumTokenLauncher {
            const uint TOKEN_ALL_ACCESS = 0xF01FF;
            const uint SE_GROUP_INTEGRITY = 0x20;
            const uint CREATE_NO_WINDOW = 0x08000000;
            [StructLayout(LayoutKind.Sequential)] struct SID_AND_ATTRIBUTES { public IntPtr Sid; public uint Attributes; }
            [StructLayout(LayoutKind.Sequential)] struct TOKEN_MANDATORY_LABEL { public SID_AND_ATTRIBUTES Label; }
            [StructLayout(LayoutKind.Sequential)] struct STARTUPINFO {
              public uint cb; public IntPtr lpReserved, lpDesktop, lpTitle;
              public uint dwX, dwY, dwXSize, dwYSize, dwXCountChars, dwYCountChars, dwFillAttribute, dwFlags;
              public ushort wShowWindow, cbReserved2;
              public IntPtr lpReserved2, hStdInput, hStdOutput, hStdError;
            }
            [StructLayout(LayoutKind.Sequential)] struct PROCESS_INFORMATION {
              public IntPtr hProcess, hThread; public uint dwProcessId, dwThreadId;
            }
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool OpenProcessToken(IntPtr process, uint access, out IntPtr token);
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool DuplicateTokenEx(IntPtr source, uint access, IntPtr attrs, int level, int type, out IntPtr token);
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool ConvertStringSidToSidW([MarshalAs(UnmanagedType.LPWStr)] string text, out IntPtr sid);
            [DllImport("advapi32.dll", SetLastError=true)] static extern uint GetLengthSid(IntPtr sid);
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool CopySid(uint length, IntPtr dest, IntPtr source);
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool SetTokenInformation(IntPtr token, int infoClass, IntPtr info, int length);
            [DllImport("advapi32.dll", EntryPoint="CreateProcessWithTokenW", CharSet=CharSet.Unicode, SetLastError=true)]
            static extern bool CreateProcessWithToken(IntPtr token, uint logonFlags, string application, string command, uint flags, IntPtr environment, string cwd, ref STARTUPINFO startup, out PROCESS_INFORMATION process);
            [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr handle);
            [DllImport("kernel32.dll")] static extern IntPtr LocalFree(IntPtr handle);
            public static uint Launch(string command) {
              IntPtr original=IntPtr.Zero, lowered=IntPtr.Zero, sid=IntPtr.Zero, buffer=IntPtr.Zero;
              try {
                if(!OpenProcessToken(Process.GetCurrentProcess().Handle,TOKEN_ALL_ACCESS,out original)) throw new Exception("OpenProcessToken "+Marshal.GetLastWin32Error());
                if(!DuplicateTokenEx(original,TOKEN_ALL_ACCESS,IntPtr.Zero,2,1,out lowered)) throw new Exception("DuplicateTokenEx "+Marshal.GetLastWin32Error());
                if(!ConvertStringSidToSidW("S-1-16-8192",out sid)) throw new Exception("ConvertStringSid "+Marshal.GetLastWin32Error());
                int labelSize=Marshal.SizeOf<TOKEN_MANDATORY_LABEL>();
                int size=labelSize+(int)GetLengthSid(sid);
                buffer=Marshal.AllocHGlobal(size);
                IntPtr inlineSid=IntPtr.Add(buffer,labelSize);
                if(!CopySid((uint)(size-labelSize),inlineSid,sid)) throw new Exception("CopySid "+Marshal.GetLastWin32Error());
                var label=new TOKEN_MANDATORY_LABEL { Label=new SID_AND_ATTRIBUTES { Sid=inlineSid, Attributes=SE_GROUP_INTEGRITY } };
                Marshal.StructureToPtr(label,buffer,false);
                if(!SetTokenInformation(lowered,25,buffer,size)) throw new Exception("SetTokenInformation "+Marshal.GetLastWin32Error());
                var si=new STARTUPINFO { cb=(uint)Marshal.SizeOf<STARTUPINFO>() };
                PROCESS_INFORMATION pi;
                if(!CreateProcessWithToken(lowered,0,null,command,CREATE_NO_WINDOW,IntPtr.Zero,null,ref si,out pi)) throw new Exception("CreateProcessWithTokenW "+Marshal.GetLastWin32Error());
                try { return pi.dwProcessId; }
                finally { CloseHandle(pi.hThread); CloseHandle(pi.hProcess); }
              } finally {
                if(buffer!=IntPtr.Zero) Marshal.FreeHGlobal(buffer);
                if(sid!=IntPtr.Zero) LocalFree(sid);
                if(lowered!=IntPtr.Zero) CloseHandle(lowered);
                if(original!=IntPtr.Zero) CloseHandle(original);
              }
            }
          }
          '@
          $lowCommand = '"' + $env:WINDIR + '\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ' + $lowScript + ' -CacheAssembly ' + $entry + ' -PoisonDll ' + $poisonDll + ' -Canary ' + $canary + ' -Result ' + $lowResult
          try { $lowPid = [MediumTokenLauncher]::Launch($lowCommand); Write-Host "MEDIUM_LAUNCH_PID=$lowPid" }
          catch { Write-Host "MEDIUM_LAUNCH_ERROR=$($_.Exception.Message)" }
          for ($i = 0; $i -lt 40 -and -not (Test-Path $lowResult); $i++) { Start-Sleep -Milliseconds 500 }
          $actor = 'high-fallback'
          if (Test-Path $lowResult) {
            $low = Get-Content -LiteralPath $lowResult -Raw | ConvertFrom-Json
            Write-Host "MEDIUM_RESULT=$($low | ConvertTo-Json -Compress)"
            if ($low.mediumIntegrity -and $low.cacheWrite -and -not $low.canaryWrite) { $actor = 'medium-same-SID' }
          } else {
            Write-Host 'MEDIUM_RESULT=unavailable'
          }
          if ($actor -eq 'high-fallback') { Copy-Item -LiteralPath $poisonDll -Destination $entry -Force }
          Write-Host "MUTATION_ACTOR=$actor"
          Write-Host "CACHE_SHA=$((Get-FileHash -LiteralPath $entry -Algorithm SHA256).Hash)"
          Write-Host "POISON_SHA=$((Get-FileHash -LiteralPath $poisonDll -Algorithm SHA256).Hash)"
          Build-Victim
          $hit1 = Run-Victim
          Write-Host "EXACT_KEY_OUTPUT_1=$hit1"
          Build-Victim
          $hit2 = Run-Victim
          Write-Host "EXACT_KEY_OUTPUT_2=$hit2"
          if ($hit1 -ne 'POISON' -or $hit2 -ne 'POISON') { throw 'Exact-key output was not poisoned twice' }
          Set-Content -LiteralPath (Join-Path $victim 'Program.cs') -Value 'Console.WriteLine("WRONG_KEY_BASELINE");'
          Build-Victim
          $wrongKey = Run-Victim
          Write-Host "WRONG_KEY_OUTPUT=$wrongKey"
          if ($wrongKey -ne 'WRONG_KEY_BASELINE') { throw 'Wrong-key control failed' }
          $wrongEntries = @(Get-ChildItem -LiteralPath $victimCache -Recurse -File -Filter assembly)
          Write-Host "KEY_COUNT_AFTER_MUTATION=$($wrongEntries.Count)"
          Remove-Item -LiteralPath (Split-Path $entry -Parent) -Recurse -Force
          Set-Content -LiteralPath (Join-Path $victim 'Program.cs') -Value 'Console.WriteLine("BASELINE");'
          Build-Victim
          $coldAgain = Run-Victim
          Write-Host "REMOVED_ENTRY_OUTPUT=$coldAgain"
          if ($coldAgain -ne 'BASELINE') { throw 'Removed-entry control failed' }
          Write-Host 'F057_RESULT=PASS'
