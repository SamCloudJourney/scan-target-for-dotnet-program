name: ASP.NET Pass 6 - cross-proxy security boundary (loopback)
on:
  push:
    branches: [research/aspnet-impact-crossproxy-20261116]
    paths:
      - '.github/workflows/aspnet-pass6-proxy.yml'
      - 'research/aspnet-boundaries/pass6/SecurityFixture.csproj'
      - 'research/aspnet-boundaries/pass6/Program.cs'
      - 'research/aspnet-boundaries/pass6/haproxy.cfg'
      - 'research/aspnet-boundaries/pass6/nginx.conf'
      - 'research/aspnet-boundaries/pass6/proxy_test.py'
      - 'research/aspnet-boundaries/pass6/yarp_test.py'
      - 'research/aspnet-boundaries/pass6/YarpFixture.csproj'
      - 'research/aspnet-boundaries/pass6/YarpProgram.cs'
      - 'research/aspnet-boundaries/pass6/H2Fixture.csproj'
      - 'research/aspnet-boundaries/pass6/H2Program.cs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '10.0.404'
            major: 10
          - sdk: '11.0.100'
            major: 11
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/aspnet-boundaries/pass6
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}
      - name: Install standard Nginx and HAProxy
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y haproxy nginx
          mkdir -p pass6-evidence
          (haproxy -vv || true) >pass6-evidence/haproxy-version.txt
          (nginx -v || true) >pass6-evidence/nginx-version.txt 2>&1
          dotnet --info >pass6-evidence/sdk-info.txt
          haproxy -c -f research/aspnet-boundaries/pass6/haproxy.cfg
          sudo mkdir -p /tmp/pass6-nginx-client /tmp/pass6-nginx-proxy
          sudo chmod 777 /tmp/pass6-nginx-client /tmp/pass6-nginx-proxy
          nginx -t -c "$PWD/research/aspnet-boundaries/pass6/nginx.conf"
      - name: Build backend and HTTP2 client
        run: |
          dotnet build research/aspnet-boundaries/pass6/SecurityFixture.csproj -p:TargetMajor=${{ matrix.major }} -o /tmp/pass6-app
          dotnet build research/aspnet-boundaries/pass6/H2Fixture.csproj -p:TargetMajor=${{ matrix.major }} -o /tmp/pass6-h2
      - name: Test proxy read/write authorization and HTTP protocol forms
        run: |
          dotnet /tmp/pass6-app/SixthFixture.dll >pass6-evidence/backend.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:5200/healthz >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:5200/healthz >/dev/null
          haproxy -db -f research/aspnet-boundaries/pass6/haproxy.cfg >pass6-evidence/haproxy.log 2>&1 &
          hap_pid=$!
          nginx -c "$PWD/research/aspnet-boundaries/pass6/nginx.conf" -g "daemon off;" >pass6-evidence/nginx-stdout.log 2>&1 &
          nx_pid=$!
          trap 'kill "$nx_pid" "$hap_pid" "$app_pid" 2>/dev/null || true' EXIT
          for port in 5202 5203 5204 5205; do
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:$port/healthz >/dev/null 2>&1; then break; fi
              sleep 0.4
            done
            curl -fsS http://127.0.0.1:$port/healthz >/dev/null
          done
          python3 research/aspnet-boundaries/pass6/proxy_test.py --major ${{ matrix.major }} --output pass6-evidence/proxy-${{ matrix.major }}.json
          dotnet /tmp/pass6-h2/H2Fixture.dll pass6-evidence/http2-${{ matrix.major }}.json
          cp /tmp/pass6-nginx-access.log pass6-evidence/nginx-access.log || true
          cp /tmp/pass6-nginx-error.log pass6-evidence/nginx-errors.log || true
      - name: Upload raw evidence including failed assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass6-crossproxy-net${{ matrix.major }}
          path: pass6-evidence/
          retention-days: 30
  yarp:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '10.0.404'
            major: 10
          - sdk: '11.0.100'
            major: 11
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/aspnet-boundaries/pass6
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}
      - name: Build YARP 2.3 and backend
        run: |
          mkdir -p yarp-evidence
          dotnet build research/aspnet-boundaries/pass6/SecurityFixture.csproj -p:TargetMajor=${{ matrix.major }} -o /tmp/pass6-app
          dotnet build research/aspnet-boundaries/pass6/YarpFixture.csproj -p:TargetMajor=${{ matrix.major }} -o /tmp/pass6-yarp
      - name: Test Microsoft's proxy and ASP.NET route authorization
        run: |
          dotnet /tmp/pass6-app/SixthFixture.dll >yarp-evidence/backend.log 2>&1 &
          backend_pid=$!
          dotnet /tmp/pass6-yarp/SixthYarp.dll >yarp-evidence/yarp.log 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" "$backend_pid" 2>/dev/null || true' EXIT
          for port in 5200 5206; do
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:$port/healthz >/dev/null 2>&1; then break; fi
              sleep 0.5
            done
            curl -fsS http://127.0.0.1:$port/healthz >/dev/null
          done
          python3 research/aspnet-boundaries/pass6/yarp_test.py yarp-evidence/yarp-${{ matrix.major }}.json
      - name: Upload YARP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass6-yarp-net${{ matrix.major }}
          path: yarp-evidence/
          retention-days: 30
