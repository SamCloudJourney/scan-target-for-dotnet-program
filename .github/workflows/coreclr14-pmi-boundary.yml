name: CoreCLR 14 isolated PMI boundary

on:
  push:
    branches:
      - research/coreclr14-pmi-boundary-20261116
    paths:
      - "research/coreclr14/**"
      - ".github/workflows/coreclr14-pmi-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-boundary:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    steps:
      - name: Sparse checkout of test and immutable source snapshots
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/coreclr14/
            release-sources/dotnet-10.0.15/runtime/src/coreclr/scripts/superpmi.py
            scan-target-v11.0.100/src/runtime/src/coreclr/scripts/superpmi.py
            scan-target-v11.0.100/src/runtime/src/coreclr/scripts/jitutil.py
            scan-target-v11.0.100/src/runtime/src/coreclr/scripts/coreclr_arguments.py
            scan-target-v11.0.100/src/runtime/src/coreclr/scripts/superpmi_collect_setup.py
            release-sources/dotnet-10.0.15/runtime/src/coreclr/scripts/jitutil.py
            release-sources/dotnet-10.0.15/runtime/src/coreclr/scripts/superpmi_collect_setup.py
            .github/workflows/coreclr14-pmi-boundary.yml
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test source-extracted PMI function (benign stdout marker)
        shell: bash
        run: python -I research/coreclr14/pmi_filename_boundary.py
      - name: Exercise real SuperPMI CLI ingress with stubbed .NET tooling
        if: runner.os != 'Windows'
        shell: bash
        run: python -I research/coreclr14/pmi_full_cli_smoke.py
      - name: Verify actual SuperPMI CI partitioning preserves the filename to the shell
        shell: bash
        run: python -I research/coreclr14/pmi_staging_to_shell.py
