name: F-076 Aspire phpMyAdmin owned lab
on:
  push:
    branches:
      - f076-aspire-phpmyadmin-20261120
permissions:
  contents: read
jobs:
  unix-cross-user:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run Aspire 17 owned lab with synthetic passwords
        shell: bash
        run: bash labs/f076-aspire-phpmyadmin-20261120/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f076-aspire-phpmyadmin-20261120
          path: ${{ runner.temp }}/f076-results/
          if-no-files-found: warn
