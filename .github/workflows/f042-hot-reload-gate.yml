name: F042 owned Hot Reload gate

on:
  push:
    branches:
      - research/f042-hot-reload-20261120
    paths:
      - .github/workflows/f042-hot-reload-gate.yml

jobs:
  watch-gate:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Install released SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Exercise shipped dotnet watch with synthetic project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --version
          $root = Join-Path $env:RUNNER_TEMP 'f042-owned'
          New-Item -ItemType Directory -Force $root | Out-Null
          $project = Join-Path $root 'Owned.csproj'
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net11.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <EnableDefaultCompileItems>true</EnableDefaultCompileItems>
            </PropertyGroup>
            <ItemGroup>
              <ProjectCapability Include="HotReloadWebSockets" />
            </ItemGroup>
            <Target Name="F042DelayChildLaunch" BeforeTargets="ComputeRunArguments">
              <Exec Command="ping 127.0.0.1 -n 46 &gt; NUL" />
            </Target>
          </Project>
          '@ | Set-Content -Path $project -Encoding utf8
          @'
          Console.WriteLine("F042_OWNED_APP_STARTED");
          await Task.Delay(TimeSpan.FromSeconds(75));
          '@ | Set-Content -Path (Join-Path $root 'Program.cs') -Encoding utf8
          dotnet build $project --nologo
          if ($LASTEXITCODE -ne 0) { throw 'F042 synthetic project build failed' }
          $peerRoot = Join-Path $env:PUBLIC 'f042-peer'
          New-Item -ItemType Directory -Force $peerRoot | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net11.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -Path (Join-Path $peerRoot 'Peer.csproj') -Encoding utf8
          @'
          using System.Net;
          using System.Net.WebSockets;
          using System.Security.Cryptography;
          internal static class Peer
          {
              public static async Task Main(string[] args)
              {
                  var (endpoint, key, mode) = (args[0], args[1], args[2]);
                  using var socket = new ClientWebSocket();
                  if (mode != "missing-origin")
                      socket.Options.SetRequestHeader("Origin", mode == "bad-origin" ? "wss://wrong.example" : "wss://localhost");
                  if (mode == "valid")
                  {
                      using var rsa = RSA.Create();
                      rsa.ImportSubjectPublicKeyInfo(Convert.FromBase64String(key), out _);
                      var ciphertext = rsa.Encrypt(RandomNumberGenerator.GetBytes(32), RSAEncryptionPadding.OaepSHA256);
                      socket.Options.AddSubProtocol(WebUtility.UrlEncode(Convert.ToBase64String(ciphertext)));
                  }
                  else if (mode == "bad-key")
                  {
                      socket.Options.AddSubProtocol("f042-invalid");
                  }
                  using var cts = new CancellationTokenSource(TimeSpan.FromSeconds(5));
                  try
                  {
                      await socket.ConnectAsync(new Uri(endpoint), cts.Token);
                      Console.WriteLine("F042_" + mode + "=ACCEPTED");
                      if (mode == "valid")
                      {
                          byte[] init = { 1, 1, 0, 0, 0, 0, 1, (byte)'x' };
                          await socket.SendAsync(init, WebSocketMessageType.Binary, true, cts.Token);
                          Console.WriteLine("F042_INIT_SENT=True");
                          await Task.Delay(1000);
                      }
                  }
                  catch (Exception ex)
                  {
                      Console.WriteLine("F042_" + mode + "=DENIED:" + ex.GetType().Name + ":" + ex.Message.Replace(Environment.NewLine, " "));
                  }
              }
          }
          '@ | Set-Content -Path (Join-Path $peerRoot 'Program.cs') -Encoding utf8
          dotnet build (Join-Path $peerRoot 'Peer.csproj') --nologo
          if ($LASTEXITCODE -ne 0) { throw 'F042 peer build failed' }
          $peerDll = Join-Path $peerRoot 'bin\Debug\net11.0\Peer.dll'
          $localUser = 'f042_peer'
          $password = 'F042!' + [guid]::NewGuid().ToString('N') + 'a9'
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $localUser -Password $securePassword -PasswordNeverExpires | Out-Null
          $credential = [pscredential]::new(".\\$localUser", $securePassword)
          @'
          param([int]$targetPid)
          $ErrorActionPreference = 'Stop'
          $p = Get-CimInstance Win32_Process -Filter "ProcessId = $targetPid"
          $visible = $false
          $key = ''
          $endpoint = ''
          if ($p -and $p.CommandLine) {
              $key = [regex]::Match($p.CommandLine, 'DOTNET_WATCH_HOTRELOAD_WEBSOCKET_KEY=([A-Za-z0-9+/=]+)').Groups[1].Value
              $endpoint = [regex]::Match($p.CommandLine, 'DOTNET_WATCH_HOTRELOAD_WEBSOCKET_ENDPOINT=(ws[^\s]+)').Groups[1].Value.Trim('"')
              $visible = $key.Length -gt 0
          }
          if (-not $visible) {
              $parts = (Get-Content 'C:\Users\Public\f042-peer-key.txt' -Raw).Trim() -split '\|', 2
              $key = $parts[0]
              $endpoint = $parts[1]
          }
          "F042_PEER_ID=$(whoami) ARGV_VISIBLE=$visible KEY_SOURCE=$(if ($visible) { 'argv' } else { 'supplied-control' })" | Set-Content 'C:\Users\Public\f042-peer-result.txt'
          & 'C:\Program Files\dotnet\dotnet.exe' 'C:\Users\Public\f042-peer\bin\Debug\net11.0\Peer.dll' $endpoint $key valid | Add-Content 'C:\Users\Public\f042-peer-result.txt'
          '@ | Set-Content -Path (Join-Path $env:PUBLIC 'f042-query.ps1') -Encoding utf8
          $out = Join-Path $root 'watch.out'
          $err = Join-Path $root 'watch.err'
          $watch = Start-Process -FilePath (Get-Command dotnet).Source -ArgumentList @('watch','--project',$project,'run','--no-restore') -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $found = $null
            for ($i = 0; $i -lt 160; $i++) {
              $found = Get-CimInstance Win32_Process -Filter "Name = 'dotnet.exe'" | Where-Object { $_.CommandLine -match 'DOTNET_WATCH_HOTRELOAD_WEBSOCKET_KEY=' } | Select-Object -First 1
              if ($found) { break }
              Start-Sleep -Milliseconds 250
            }
            if ($found) {
              $key = [regex]::Match($found.CommandLine, 'DOTNET_WATCH_HOTRELOAD_WEBSOCKET_KEY=([A-Za-z0-9+/=]+)').Groups[1].Value
              $endpoint = [regex]::Match($found.CommandLine, 'DOTNET_WATCH_HOTRELOAD_WEBSOCKET_ENDPOINT=(ws[^\s]+)').Groups[1].Value.Trim('"')
              Write-Output "F042_ARGV_PRESENT=True PID=$($found.ProcessId) KEY_LENGTH=$($key.Length) ENDPOINT=$endpoint"
              "$key|$endpoint" | Set-Content (Join-Path $env:PUBLIC 'f042-peer-key.txt')
              try {
                $peerProbe = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList @('-NoProfile','-NonInteractive','-File',(Join-Path $env:PUBLIC 'f042-query.ps1'),"$($found.ProcessId)") -Credential $credential -PassThru -Wait
                Write-Output "F042_CROSS_USER_EXIT=$($peerProbe.ExitCode)"
                if (Test-Path (Join-Path $env:PUBLIC 'f042-peer-result.txt')) { Get-Content (Join-Path $env:PUBLIC 'f042-peer-result.txt') }
              } catch {
                Write-Output "F042_CROSS_USER_ERROR=$($_.Exception.GetType().Name):$($_.Exception.Message)"
              }
              & dotnet $peerDll $endpoint $key bad-origin
              & dotnet $peerDll $endpoint $key bad-key
              & dotnet $peerDll $endpoint $key valid
            } else {
              Write-Output 'F042_ARGV_PRESENT=False'
            }
            Start-Sleep -Seconds 3
            if (Test-Path $out) { Write-Output 'F042_WATCH_STDOUT_BEGIN'; Get-Content $out -Tail 60 | ForEach-Object { $_ -replace 'DOTNET_WATCH_HOTRELOAD_WEBSOCKET_KEY=[A-Za-z0-9+/=]+', 'DOTNET_WATCH_HOTRELOAD_WEBSOCKET_KEY=<redacted>' }; Write-Output 'F042_WATCH_STDOUT_END' }
            if (Test-Path $err) { Write-Output 'F042_WATCH_STDERR_BEGIN'; Get-Content $err -Tail 60; Write-Output 'F042_WATCH_STDERR_END' }
          } finally {
            Get-CimInstance Win32_Process -Filter "Name = 'dotnet.exe'" | Where-Object { $_.CommandLine -match 'f042-owned' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $watch.Id -Force -ErrorAction SilentlyContinue
          }
