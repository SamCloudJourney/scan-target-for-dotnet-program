name: Bounded Kestrel HTTP2 form parser and recovery
on:
  push:
    branches: [research/bounded-resource-probes-20261116]
    paths:
      - 'research/bounded-resource-probes/FormH2/**'
      - '.github/workflows/resource-form-http2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loopback-h2c:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: research/bounded-resource-probes
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Build own HTTP2 form fixture
        shell: bash
        run: |
          set -euo pipefail
          dotnet build research/bounded-resource-probes/FormH2/FormH2.csproj -c Release -f net10.0
          dotnet build research/bounded-resource-probes/FormH2/FormH2.csproj -c Release -f net11.0
      - name: Execute only bounded loopback h2c tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p form-h2-evidence
          for spec in '10.0.15 net10.0' '11.0.0 net11.0'; do
            read -r tag fx <<< "$spec"
            image="mcr.microsoft.com/dotnet/aspnet:$tag"
            docker pull "$image"
            dir="$PWD/research/bounded-resource-probes/FormH2/bin/Release/$fx"
            timeout --signal=TERM --kill-after=3s 60s docker run --rm \
              --memory=384m --memory-swap=384m --cpus=1 --pids-limit=48 \
              --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=12m \
              -e DOTNET_GCHeapHardLimit=0xC000000 -v "$dir:/app:ro" \
              "$image" dotnet /app/FormH2.dll \
              | tee -a form-h2-evidence/http2-results.jsonl
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-real-kestrel-http2-form
          path: form-h2-evidence/
          retention-days: 14
          if-no-files-found: warn
