name: Actual System.IO.Pipelines segment geometry and form parser
on:
  push:
    branches: [research/bounded-resource-probes-20261116]
    paths:
      - 'research/bounded-resource-probes/PipeShape/**'
      - '.github/workflows/resource-pipe-shape.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pipe-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research/bounded-resource-probes
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Build independent default System.IO.Pipelines probe
        shell: bash
        run: |
          set -euo pipefail
          dotnet build research/bounded-resource-probes/PipeShape/PipeShape.csproj -c Release -f net10.0
          dotnet build research/bounded-resource-probes/PipeShape/PipeShape.csproj -c Release -f net11.0
      - name: Measure actual retained sequence segments and parser costs in memory-limited containers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pipe-shape-evidence
          for fx in net10.0 net11.0; do
            if [ "$fx" = net10.0 ]; then tag=10.0.15; else tag=11.0.0; fi
            image="mcr.microsoft.com/dotnet/aspnet:$tag"
            docker pull "$image"
            app="$PWD/research/bounded-resource-probes/PipeShape/bin/Release/$fx"
            run_case() {
              timeout --signal=TERM --kill-after=2s 14s docker run --rm \
                --memory=384m --memory-swap=384m --cpus=1 --pids-limit=48 \
                --network none --read-only --tmpfs /tmp:rw,nosuid,size=16m \
                -e DOTNET_GCHeapHardLimit=0x10000000 \
                -v "$app:/app:ro" "$image" dotnet /app/PipeShape.dll "$@" \
                | tee -a pipe-shape-evidence/default-pipe.jsonl
            }
            for n in 4096 8192; do
              for step in 1 64; do
                run_case shape "$n" "$step"
                run_case parse "$n" "$step"
              done
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: default-pipe-shape-measurements
          path: pipe-shape-evidence/
          retention-days: 14
