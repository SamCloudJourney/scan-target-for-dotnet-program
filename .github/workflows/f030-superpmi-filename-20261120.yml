name: F030 SuperPMI filename boundary
on:
  push:
    branches: [f030-superpmi-filename-20261120]
permissions:
  contents: read
jobs:
  two-principal-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run pinned SuperPMI with two principals and controls
        shell: bash
        run: |
          set -euo pipefail
          root="/tmp/f030_lab"
          src="$root/src"
          core="$root/core"
          inputDir="$root/intake"
          nested="$inputDir/nested"
          protected="$root/protected"
          cache="$root/cache"
          mkdir -p "$src" "$core" "$nested" "$protected" "$cache"
          chmod 755 "$root"
          chmod 777 "$inputDir" "$nested"
          for file in superpmi.py coreclr_arguments.py jitutil.py; do
            curl -fsSL "https://raw.githubusercontent.com/dotnet/runtime/v10.0.15/src/coreclr/scripts/$file" -o "$src/$file"
            sha256sum "$src/$file"
          done
          cat > "$core/corerun" <<'STUB'
          #!/bin/sh
          printf 'F030_TOOL_ID=%s\n' "$(id -un)"
          STUB
          chmod 755 "$core/corerun"
          cp "$core/corerun" "$core/superpmi"
          cp "$core/corerun" "$core/mcs"
          : > "$core/pmi.dll"
          marker='F030_SYNTHETIC_CANARY_20261120'
          printf '%s\n' "$marker" > "$protected/canary.txt"
          chmod 700 "$protected"
          chmod 600 "$protected/canary.txt"
          export F030_CANARY_PATH="$protected/canary.txt"
          sudo -u nobody env -u F030_CANARY_PATH python3 - "$root" <<'ACTOR'
          import pathlib, sys
          root=pathlib.Path(sys.argv[1])
          intake=root/'intake'
          nested=intake/'nested'
          try:
              (root/'protected'/'canary.txt').read_text()
              direct='READ_ALLOWED'
          except PermissionError:
              direct='DENIED'
          (intake/'direct.txt').write_text(direct)
          (nested/'safe.dll').write_bytes(b'')
          (nested/'seed; cat "$F030_CANARY_PATH" ; #.txt').write_bytes(b'')
          ACTOR
          direct="$(cat "$inputDir/direct.txt")"
          printf 'DIRECT_READ=%s\n' "$direct"
          test "$direct" = DENIED
          run_collection() {
            caseName="$1"
            temp="$root/temp_$caseName"
            mkdir -p "$temp"
            printf 'CLI=python3 %s collect --pmi --skip_merge_step --skip_toc_step --skip_cleanup -core_root %s -pmi_location %s -assemblies %s -spmi_location %s -temp_dir %s -output_mch_path %s -log_level DEBUG\n' "$src/superpmi.py" "$core" "$core/pmi.dll" "$inputDir" "$cache" "$temp" "$root/$caseName.mch"
            set +e
            python3 "$src/superpmi.py" collect --pmi --skip_merge_step --skip_toc_step --skip_cleanup -core_root "$core" -pmi_location "$core/pmi.dll" -assemblies "$inputDir" -spmi_location "$cache" -temp_dir "$temp" -output_mch_path "$root/$caseName.mch" -log_level DEBUG > "$root/$caseName.log" 2>&1
            exitCode=$?
            set -e
            printf 'CASE=%s CLI_EXIT=%s\n' "$caseName" "$exitCode"
            grep -E 'Using assemblies:|safe.dll|seed;|Starting collection using PMI|Error|No assemblies' "$root/$caseName.log" | head -18 || true
            cat "$temp"/*.stdout 2>/dev/null || true
          }
          safeOutput="$(run_collection safe)"
          printf '%s\n' "$safeOutput"
          if printf '%s' "$safeOutput" | grep -q "$marker"; then echo 'safe control leaked canary'; exit 1; fi
          if ! printf '%s' "$safeOutput" | grep -q 'F030_TOOL_ID=runner'; then echo 'safe control did not reach tool'; exit 1; fi
          sudo -u nobody env -u F030_CANARY_PATH python3 - "$nested" <<'ACTOR'
          import pathlib, sys
          (pathlib.Path(sys.argv[1])/'seed; cat "$F030_CANARY_PATH" ; #.dll').write_bytes(b'')
          ACTOR
          payloadPath="$nested/"'seed; cat "$F030_CANARY_PATH" ; #.dll'
          test -f "$payloadPath"
          oneOutput="$(run_collection one_factor_1)"
          printf '%s\n' "$oneOutput"
          if ! printf '%s' "$oneOutput" | grep -q "$marker"; then echo 'one-factor DLL did not read canary'; exit 1; fi
          twoOutput="$(run_collection one_factor_2)"
          printf '%s\n' "$twoOutput"
          if ! printf '%s' "$twoOutput" | grep -q "$marker"; then echo 'second run did not read canary'; exit 1; fi
          argvOutput="$(python3 - "$core/corerun" "$core/pmi.dll" "$payloadPath" <<'ARGV'
          import subprocess, sys
          print(subprocess.run([sys.argv[1],sys.argv[2],'DRIVEALL',sys.argv[3]],capture_output=True,text=True).stdout,end='')
          ARGV
          )"
          printf 'ARGV_CONTROL=%s\n' "$argvOutput"
          if printf '%s' "$argvOutput" | grep -q "$marker"; then echo 'argv control leaked canary'; exit 1; fi
          printf 'F030_RESULT=TWO_PRINCIPAL_SYNTHETIC_BOUNDARY_REPRODUCED\n'
