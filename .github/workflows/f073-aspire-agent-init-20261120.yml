name: F073 Aspire agent init owned canary lab
on:
  push:
    branches:
      - f073-aspire-agent-init-20261120
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install released CLI and Playwright CLI
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install Aspire.Cli --version 17.0.0 --tool-path "$RUNNER_TEMP/f073-tools"
          npm install -g --prefix "$RUNNER_TEMP/f073-npm" @playwright/cli
          "$RUNNER_TEMP/f073-tools/aspire" --version
          "$RUNNER_TEMP/f073-npm/bin/playwright-cli" --version
      - name: Cross-principal canary matrix
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/f073-tools:$RUNNER_TEMP/f073-npm/bin:$PATH"
          base="/tmp/f073-lab-$GITHUB_RUN_ID"
          mkdir -p "$base"
          chmod 755 "$base"
          sudo useradd -m f073low
          new_case() {
            kind="$1"
            case_dir="$base/$kind"
            repo="$case_dir/repo"
            protected="$case_dir/protected"
            mkdir -p "$repo/.agents/skills" "$protected"
            chmod 755 "$case_dir" "$repo" "$repo/.agents"
            chmod 777 "$repo/.agents/skills"
            chmod 700 "$protected"
            printf 'OUTSIDE_OLD\n' > "$protected/SKILL.md"
            printf 'DELETE_ME\n' > "$protected/stale.md"
            git -C "$repo" init -q
            sudo chown -R f073low:f073low "$repo"
            sudo -u f073low ln -s ../../../protected "$repo/.agents/skills/playwright-cli"
            sudo -u f073low git -C "$repo" add .agents/skills/playwright-cli
            sudo -u f073low git -C "$repo" -c user.name=f073low -c user.email=f073low@example.invalid commit -qm 'Add repository skill link'
            git clone -q "$repo" "$case_dir/checkout"
            repo="$case_dir/checkout"
            test -L "$repo/.agents/skills/playwright-cli"
            echo "COMMIT_ACTOR=$(git -C "$repo" log -1 --format='%an <%ae>')"
            echo "CASE=$kind"
            git -C "$repo" ls-files --stage .agents/skills/playwright-cli
            echo "link=$(readlink "$repo/.agents/skills/playwright-cli")"
            echo "resolved=$(readlink -f "$repo/.agents/skills/playwright-cli")"
            echo "protected_perms=$(stat -c '%U:%G %a' "$protected")"
            if sudo -u f073low test -r "$protected/SKILL.md"; then
              echo "LOW_DIRECT_READ=ALLOWED"
              exit 1
            else
              echo "LOW_DIRECT_READ=DENIED"
            fi
            if sudo -u f073low test -w "$protected/SKILL.md"; then
              echo "LOW_DIRECT_WRITE=ALLOWED"
              exit 1
            else
              echo "LOW_DIRECT_WRITE=DENIED"
            fi
            test -w "$protected/SKILL.md"
          }
          unchanged() {
            protected="$1"
            test "$(cat "$protected/SKILL.md")" = OUTSIDE_OLD
            test "$(cat "$protected/stale.md")" = DELETE_ME
          }
          changed() {
            protected="$1"
            test "$(cat "$protected/SKILL.md")" != OUTSIDE_OLD
            test ! -e "$protected/stale.md"
            echo "OUTSIDE_SKILL_SHA256=$(sha256sum "$protected/SKILL.md" | cut -d ' ' -f 1)"
            echo "OUTSIDE_STALE_EXISTS=no"
          }
          new_case raw
          ( cd "$base/raw/checkout" && playwright-cli install --skills )
          unchanged "$base/raw/protected"
          echo "RAW_PLAYWRIGHT_CONTROL=UNCHANGED"
          new_case denied
          aspire agent init --workspace-root "$base/denied/checkout" --agents copilot --scope project --skills none
          unchanged "$base/denied/protected"
          echo "SKILL_NONE_CONTROL=UNCHANGED"
          for kind in positive1 positive2; do
            new_case "$kind"
            aspire agent init --workspace-root "$base/$kind/checkout" --agents copilot --scope project --skills playwright-cli
            changed "$base/$kind/protected"
            echo "ASPIRE_$kind=OUTSIDE_WRITE_AND_DELETE"
          done
          mkdir -p "$base/path/repo/.agents/skills/playwright-cli"
          printf 'INSIDE_OLD\n' > "$base/path/repo/.agents/skills/playwright-cli/SKILL.md"
          printf 'DELETE_ME\n' > "$base/path/repo/.agents/skills/playwright-cli/stale.md"
          aspire agent init --workspace-root "$base/path/repo" --agents copilot --scope project --skills playwright-cli
          test "$(cat "$base/path/repo/.agents/skills/playwright-cli/SKILL.md")" != INSIDE_OLD
          test ! -e "$base/path/repo/.agents/skills/playwright-cli/stale.md"
          echo "IN_REPOSITORY_PATH_CONTROL=WRITE_AND_DELETE"
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Install released CLI and Playwright CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install Aspire.Cli --version 17.0.0 --tool-path "$env:RUNNER_TEMP\f073-tools"
          npm install -g --prefix "$env:RUNNER_TEMP\f073-npm" @playwright/cli
          Get-ChildItem "$env:RUNNER_TEMP\f073-tools" | Select-Object Name,Length
          Get-Command aspire* -ErrorAction SilentlyContinue | Select-Object Name,Source
          $cli = Get-ChildItem "$env:RUNNER_TEMP\f073-tools" | Where-Object Name -Like "aspire*" | Select-Object -First 1
          & $cli.FullName --version
          & "$env:RUNNER_TEMP\f073-npm\playwright-cli.cmd" --version
      - name: Windows symlink and canary matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:RUNNER_TEMP\f073-tools;$env:RUNNER_TEMP\f073-npm;$env:PATH"
          $base = Join-Path $env:RUNNER_TEMP 'f073-windows'
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          function New-Case([string]$kind) {
            $caseDir = Join-Path $base $kind
            $repo = Join-Path $caseDir 'repo'
            $protected = Join-Path $caseDir 'protected'
            New-Item -ItemType Directory -Force -Path (Join-Path $repo '.agents\skills'), $protected | Out-Null
            Set-Content -Path (Join-Path $protected 'SKILL.md') -Value 'OUTSIDE_OLD'
            Set-Content -Path (Join-Path $protected 'stale.md') -Value 'DELETE_ME'
            git -C $repo init -q
            git -C $repo config core.symlinks true
            $link = Join-Path $repo '.agents\skills\playwright-cli'
            New-Item -ItemType SymbolicLink -Path $link -Target $protected | Out-Null
            git -C $repo add .agents/skills/playwright-cli
            git -C $repo -c user.name=f073lab -c user.email=f073lab@example.invalid commit -qm 'Add repository skill link'
            $checkout = Join-Path $caseDir 'checkout'
            git -c core.symlinks=true clone -q $repo $checkout
            $repo = $checkout
            if ((Get-Item (Join-Path $repo '.agents\skills\playwright-cli')).LinkType -ne 'SymbolicLink') { throw 'Checkout did not preserve symlink' }
            Write-Host "CASE=$kind"
            git -C $repo ls-files --stage .agents/skills/playwright-cli | ForEach-Object { Write-Host $_ }
            Write-Host "LINK_TARGET=$((Get-Item (Join-Path $repo '.agents\skills\playwright-cli')).Target)"
            return @{ repo = $repo; protected = $protected }
          }
          function Assert-Unchanged($protected) {
            if ((Get-Content (Join-Path $protected 'SKILL.md') -Raw).Trim() -ne 'OUTSIDE_OLD') { throw 'Outside overwrite in negative control' }
            if (-not (Test-Path (Join-Path $protected 'stale.md'))) { throw 'Outside deletion in negative control' }
          }
          $denied = New-Case 'denied'
          $cli = Get-ChildItem "$env:RUNNER_TEMP\f073-tools" | Where-Object Name -Like "aspire*" | Select-Object -First 1
          & $cli.FullName agent init --workspace-root $denied.repo --agents copilot --scope project --skills none
          if ($LASTEXITCODE -ne 0) { throw "Denied CLI exited $LASTEXITCODE" }
          Assert-Unchanged $denied.protected
          Write-Output 'SKILL_NONE_CONTROL=UNCHANGED'
          $positive = New-Case 'positive'
          & $cli.FullName agent init --workspace-root $positive.repo --agents copilot --scope project --skills playwright-cli
          Write-Output "ASPIRE_EXIT=$LASTEXITCODE"
          $skill = Join-Path $positive.protected 'SKILL.md'
          $stale = Join-Path $positive.protected 'stale.md'
          Write-Output "OUTSIDE_SKILL_SHA256=$((Get-FileHash $skill -Algorithm SHA256).Hash)"
          Write-Output "OUTSIDE_STALE_EXISTS=$(Test-Path $stale)"
          if ($LASTEXITCODE -ne 0) { throw 'Aspire CLI failed' }
          if ((Get-Content $skill -Raw).Trim() -eq 'OUTSIDE_OLD') { throw 'Outside overwrite not observed' }
          if (Test-Path $stale) { throw 'Outside deletion not observed' }
          Write-Output 'WINDOWS_SYMLINK=OUTSIDE_WRITE_AND_DELETE'
